schema_version: "1.0"

workflow:
  id: "spec-kit-quick-flow"
  name: "Spec-Kit Extended Flow — Quick Flow"
  version: "0.18.0"
  author: "Markus Wondrak"
  description: "The Quick Flow: lightweight pipeline for trivial, well-defined changes (label renames, message additions, small tweaks). Produces a minimal plan reviewed at a human gate, implements its approved scope, runs a self-fixing review in a single pass, then ships, escalates, or aborts explicitly. No spec or task-list generation."

requires:
  speckit_version: ">=0.8.5"
  integrations:
    any:
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: false
    default: ""
    prompt: "What to change. A plain-text description of the trivial change (e.g., 'Rename login button label to Sign In')."
  file:
    type: string
    required: false
    default: ""
    prompt: "Path to a change description file (e.g., ./changes/label-fix.md). The file contents will be used as the instruction."
  issue:
    type: string
    required: false
    default: ""
    prompt: "GitHub issue number from this repository (e.g., 42). The issue title and body will be used as the change instruction."
  integration:
    type: string
    required: false
    default: "auto"
    prompt: "AI integration to dispatch commands to (auto = detect from .specify/integration.json)"
  model_config:
    type: string
    required: false
    default: ""
    prompt: "Path to a per-step model config JSON (defaults to ./model.config.json, then the preset default)"

steps:
  - id: resolve-spec
    type: shell
    run: python3 .specify/presets/spec-kit-extended-flow/scripts/resolve-spec.py "{{ context.run_id }}"

  - id: load-models
    type: shell
    run: python3 .specify/presets/spec-kit-extended-flow/scripts/load-models.py "{{ context.run_id }}"
    output_format: json

  - id: create-branch
    type: if
    condition: "{{ inputs.issue != '' }}"
    then:
      - id: branch
        type: shell
        run: python3 .specify/presets/spec-kit-extended-flow/scripts/create-branch.py "{{ context.run_id }}"

  - id: init-quick
    type: shell
    run: python3 .specify/presets/spec-kit-extended-flow/scripts/init-quick.py "{{ context.run_id }}"

  - id: quick-plan
    command: speckit.extendedflow.quick-plan
    integration: "{{ inputs.integration }}"
    model: "{{ steps.load-models.output.data.quick-plan.model }}"
    input:
      args: "{{ steps.resolve-spec.output.stdout }}"

  - id: quick-plan-gate
    type: gate
    message: "Review the generated quick plan in specs/<feature-dir>/plan.md. Approve to implement, or reject to stop and edit the plan."
    options: [approve, reject]
    on_reject: abort

  - id: record-quick-scope
    type: shell
    run: python3 .specify/presets/spec-kit-extended-flow/scripts/record-quick-scope.py "{{ context.run_id }}"

  - id: quick-implement
    command: speckit.extendedflow.quick-implement
    integration: "{{ inputs.integration }}"
    model: "{{ steps.load-models.output.data.quick-implement.model }}"
    input:
      args: "{{ steps.resolve-spec.output.stdout }}"

  - id: quick-review
    command: speckit.extendedflow.quick-review
    integration: "{{ inputs.integration }}"
    model: "{{ steps.load-models.output.data.quick-review.model }}"

  - id: quick-review-verdict
    type: shell
    run: python3 .specify/presets/spec-kit-extended-flow/scripts/extract-verdict.py "{{ context.run_id }}"

  - id: route-quick-review
    type: if
    condition: "{{ steps.quick-review-verdict.output.stdout | contains('FAIL') }}"
    then:
      - id: preserve-quick-review
        type: shell
        run: python3 .specify/presets/spec-kit-extended-flow/scripts/preserve-quick-review.py "{{ context.run_id }}"
      - id: quick-review-resolution
        type: gate
        message: "Quick review found unresolved approved-scope work. Choose ship-partial to continue with the committed partial change, escalate to preserve the branch for Feature Flow, or abort."
        options: [ship-partial, escalate, abort]
        on_reject: abort
      - id: ship-partial
        type: if
        condition: "{{ steps.quick-review-resolution.output.choice == 'ship-partial' }}"
        then:
          - id: doc-check-partial
            command: speckit.extendedflow.doc-check
            integration: "{{ inputs.integration }}"
            model: "{{ steps.load-models.output.data.doc-check-partial.model }}"
          - id: finish-partial
            command: speckit.extendedflow.finish
            integration: "{{ inputs.integration }}"
            model: "{{ steps.load-models.output.data.finish-partial.model }}"
            input:
              args: "{{ context.run_id }}"
        else:
          - id: feature-flow-handoff
            type: shell
            run: "echo 'Quick Flow work was preserved in a WIP commit. Continue this branch with the Feature Flow; review-findings-1-FAIL.md and the approved plan remain available until that flow finishes.'"
    else:
      - id: doc-check
        command: speckit.extendedflow.doc-check
        integration: "{{ inputs.integration }}"
        model: "{{ steps.load-models.output.data.doc-check.model }}"
      - id: finish
        command: speckit.extendedflow.finish
        integration: "{{ inputs.integration }}"
        model: "{{ steps.load-models.output.data.finish.model }}"
        input:
          args: "{{ context.run_id }}"
