schema_version: "1.0"

workflow:
  id: "spec-kit-bugfix-flow"
  name: "Spec-Kit Extended Flow — Bugfix Flow"
  version: "0.2.0"
  author: "Markus Wondrak"
  description: "The Bugfix Flow: Spec-Kit's standard bug assessment, fix, and verification commands with an assessment gate and issue-to-PR automation."

requires:
  speckit_version: ">=0.9.0"
  integrations:
    any:
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: false
    default: ""
    prompt: "Description of the bug. A plain-text description of the error and expected behavior."
  file:
    type: string
    required: false
    default: ""
    prompt: "Path to a bug report file (e.g., ./reports/bug.md). The file contents will be used as the bug description."
  issue:
    type: string
    required: false
    default: ""
    prompt: "GitHub issue number from this repository (e.g., 42). The issue title and body will be used as the bug description."
  integration:
    type: string
    required: false
    default: "auto"
    prompt: "AI integration to dispatch commands to (auto = detect from .specify/integration.json)"

steps:
  - id: resolve-spec
    type: shell
    run: bash .specify/presets/spec-kit-extended-flow/scripts/resolve-spec.sh "{{ inputs.spec }}" "{{ inputs.file }}" "{{ inputs.issue }}"

  - id: create-branch
    type: if
    condition: "{{ inputs.issue != '' }}"
    then:
      - id: branch
        type: shell
        run: bash .specify/presets/spec-kit-extended-flow/scripts/create-branch.sh "{{ inputs.issue }}" "fix"

  - id: bug-assess
    command: speckit.bug.assess
    integration: "{{ inputs.integration }}"
    model: ""
    input:
      args: "{{ steps.resolve-spec.output.stdout }}"

  - id: resolve-bug-context
    type: shell
    run: bash .specify/presets/spec-kit-extended-flow/scripts/resolve-bug-context.sh

  - id: assessment-gate
    type: gate
    message: "Review the generated bug assessment in .specify/bugs/<slug>/assessment.md. Approve to continue to the fix, or reject to stop."
    options: [approve, reject]
    on_reject: abort

  - id: bug-fix
    command: speckit.bug.fix
    integration: "{{ inputs.integration }}"
    model: ""
    input:
      args: "slug={{ steps.resolve-bug-context.output.stdout }}"

  - id: bug-test
    command: speckit.bug.test
    integration: "{{ inputs.integration }}"
    model: ""
    input:
      args: "slug={{ steps.resolve-bug-context.output.stdout }}"

  - id: bug-verification
    type: shell
    run: bash .specify/presets/spec-kit-extended-flow/scripts/check-bug-verdict.sh

  - id: finish
    command: speckit.extendedflow.finish
    integration: "{{ inputs.integration }}"
    model: ""
    input:
      args: "{{ context.run_id }}"
