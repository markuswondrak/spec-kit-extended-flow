schema_version: "1.0"

workflow:
  id: "spec-kit-bugfix-flow"
  name: "Spec-Kit Extended Flow — Bugfix Flow"
  version: "0.1.0"
  author: "Markus Wondrak"
  description: "The Bugfix Flow: TDD bugfix with QA review. Runs root-cause analysis, a RED test, a GREEN fix, a QA review loop, and issue-to-PR automation. When started from a GitHub issue, automatically creates a fix branch, cleans up temporary files, and opens a pull request."

requires:
  speckit_version: ">=0.8.5"
  integrations:
    any:
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: false
    default: ""
    prompt: "Description of the bug. A plain-text description of the error and expected behavior."
  file:
    type: string
    required: false
    default: ""
    prompt: "Path to a bug report file (e.g., ./reports/bug.md). The file contents will be used as the bug description."
  issue:
    type: string
    required: false
    default: ""
    prompt: "GitHub issue number from this repository (e.g., 42). The issue title and body will be used as the bug description."
  integration:
    type: string
    required: false
    default: "auto"
    prompt: "AI integration to dispatch commands to (auto = detect from .specify/integration.json)"

steps:
  - id: resolve-spec
    type: shell
    run: bash .specify/presets/spec-kit-extended-flow/scripts/resolve-spec.sh "{{ inputs.spec }}" "{{ inputs.file }}" "{{ inputs.issue }}"

  - id: create-branch
    type: if
    condition: "{{ inputs.issue != '' }}"
    then:
      - id: branch
        type: shell
        run: bash .specify/presets/spec-kit-extended-flow/scripts/create-branch.sh "{{ inputs.issue }}" "fix"

  - id: bug-analyze
    command: speckit.extendedflow.bug-analyze
    integration: "{{ inputs.integration }}"
    model: ""
    input:
      args: "{{ steps.resolve-spec.output.stdout }}"

  - id: analysis-gate
    type: gate
    message: "Review the generated bug analysis. Approve to continue to test creation, or reject to stop and edit the analysis."
    options: [approve, reject]
    on_reject: abort

  - id: bug-test
    command: speckit.extendedflow.bug-test
    integration: "{{ inputs.integration }}"
    model: ""

  - id: bug-fix
    command: speckit.extendedflow.bug-fix
    integration: "{{ inputs.integration }}"
    model: ""

  - id: bug-review
    command: speckit.extendedflow.bug-review
    integration: "{{ inputs.integration }}"
    model: ""

  - id: bug-review-verdict
    type: shell
    run: bash .specify/presets/spec-kit-extended-flow/scripts/extract-verdict.sh "{{ context.run_id }}"

  - id: fix-if-needed
    type: if
    condition: "{{ steps.bug-review-verdict.output.stdout | contains('FAIL') }}"
    then:
      - id: fix-loop
        type: do-while
        condition: "{{ steps.fix-verdict.output.stdout | contains('FAIL') }}"
        max_iterations: 5
        steps:
          - id: fix
            command: speckit.extendedflow.bug-fix
            integration: "{{ inputs.integration }}"
            model: ""
          - id: fix-review
            command: speckit.extendedflow.bug-review
            integration: "{{ inputs.integration }}"
            model: ""
          - id: fix-verdict
            type: shell
            run: bash .specify/presets/spec-kit-extended-flow/scripts/extract-verdict.sh "{{ context.run_id }}"

  - id: stop-on-review-fail
    type: if
    condition: "{{ steps.fix-verdict.output.stdout | contains('FAIL') }}"
    then:
      - id: review-failed
        type: shell
        run: "echo 'QA review still failed after the maximum number of iterations. See review-findings-{N}-FAIL.md inside the current feature directory for details.' >&2; exit 1"

  - id: finish
    command: speckit.extendedflow.finish
    integration: "{{ inputs.integration }}"
    model: ""
    input:
      args: "{{ context.run_id }} {{ inputs.issue }}"
