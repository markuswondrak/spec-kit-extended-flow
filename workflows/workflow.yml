schema_version: "1.0"

workflow:
  id: "spec-kit-extended-flow"
  name: "Spec-Kit Extended Flow — Feature Flow"
  version: "0.10.1"
  author: "Markus Wondrak"
  description: "The Feature Flow: SDD lifecycle with a Spec-Kit convergence loop and documentation reconciliation. Runs specification, planning, tasks, a consistency analysis, implementation, implement/converge iterations until converged, and documentation reconciliation. When started from a GitHub issue, automatically creates a feature branch, cleans up temporary files, and opens a pull request."

requires:
  speckit_version: ">=0.11.2"
  integrations:
    any:
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: false
    default: ""
    prompt: "What to build. A plain-text description of the feature or change."
  file:
    type: string
    required: false
    default: ""
    prompt: "Path to a spec file (e.g., ./specs/feature.md). The file contents will be used as the specification."
  issue:
    type: string
    required: false
    default: ""
    prompt: "GitHub issue number from this repository (e.g., 42). The issue title and body will be used as the specification."
  integration:
    type: string
    required: false
    default: "auto"
    prompt: "AI integration to dispatch commands to (auto = detect from .specify/integration.json)"
steps:
  - id: resolve-spec
    type: shell
    run: python3 .specify/presets/spec-kit-extended-flow/scripts/resolve-spec.py "{{ inputs.spec }}" "{{ inputs.file }}" "{{ inputs.issue }}"

  - id: create-branch
    type: if
    condition: "{{ inputs.issue != '' }}"
    then:
      - id: branch
        type: shell
        run: python3 .specify/presets/spec-kit-extended-flow/scripts/create-branch.py "{{ inputs.issue }}"

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    model: ""
    input:
      args: "{{ steps.resolve-spec.output.stdout }}"

  - id: verify-spec
    type: shell
    run: python3 .specify/presets/spec-kit-extended-flow/scripts/verify-spec.py

  - id: spec-gate
    type: gate
    message: "Review the generated specification. Approve to continue to planning, or reject to stop and edit the spec."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    model: ""
    input:
      args: "Infer the technical approach from the existing project. Reuse the current stack, architecture, test strategy, and quality constraints. Only introduce new dependencies, services, or infrastructure when required by the spec; document unresolved decisions as NEEDS CLARIFICATION."

  - id: plan-gate
    type: gate
    message: "Review the generated implementation plan. Approve to create tasks, or reject to stop and edit the plan."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    model: ""

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    model: ""

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    model: ""

  - id: converge-loop
    type: do-while
    condition: "{{ steps.converge-check.output.stdout | contains('TASKS_APPENDED') }}"
    max_iterations: 5
    steps:
      - id: converge-snapshot
        type: shell
        run: python3 .specify/presets/spec-kit-extended-flow/scripts/check-converge.py snapshot "{{ context.run_id }}"
      - id: converge
        command: speckit.converge
        integration: "{{ inputs.integration }}"
        model: ""
      - id: converge-check
        type: shell
        run: python3 .specify/presets/spec-kit-extended-flow/scripts/check-converge.py check "{{ context.run_id }}"
      - id: converge-implement
        type: if
        condition: "{{ steps.converge-check.output.stdout | contains('TASKS_APPENDED') }}"
        then:
          - id: converge-implement-run
            command: speckit.implement
            integration: "{{ inputs.integration }}"
            model: ""

  - id: stop-on-not-converged
    type: if
    condition: "{{ steps.converge-check.output.stdout | contains('TASKS_APPENDED') }}"
    then:
      - id: not-converged
        type: shell
        run: "echo 'speckit.converge still reported remaining work after the maximum number of iterations. Inspect the appended tasks in tasks.md and run the Feature Flow again.' >&2; exit 1"

  - id: documentation
    command: speckit.extendedflow.documentation
    integration: "{{ inputs.integration }}"
    model: ""

  - id: finish
    command: speckit.extendedflow.finish
    integration: "{{ inputs.integration }}"
    model: ""
    input:
      args: "{{ context.run_id }}"
