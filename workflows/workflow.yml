schema_version: "1.0"

workflow:
  id: "spec-kit-extended-flow"
  name: "Spec-Kit Extended Flow — Feature Flow"
  version: "0.9.0"
  author: "Markus Wondrak"
  description: "The Feature Flow: SDD lifecycle with QA review and documentation reconciliation. Runs specification, planning, tasks, implementation, a QA review loop, and documentation reconciliation. When started from a GitHub issue, automatically creates a feature branch, cleans up temporary files, and opens a pull request."

requires:
  speckit_version: ">=0.8.5"
  integrations:
    any:
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: false
    default: ""
    prompt: "What to build. A plain-text description of the feature or change."
  file:
    type: string
    required: false
    default: ""
    prompt: "Path to a spec file (e.g., ./specs/feature.md). The file contents will be used as the specification."
  issue:
    type: string
    required: false
    default: ""
    prompt: "GitHub issue number from this repository (e.g., 42). The issue title and body will be used as the specification."
  integration:
    type: string
    required: false
    default: "auto"
    prompt: "AI integration to dispatch commands to (auto = detect from .specify/integration.json)"
steps:
  - id: resolve-spec
    type: shell
    run: bash .specify/presets/spec-kit-extended-flow/scripts/resolve-spec.sh "{{ inputs.spec }}" "{{ inputs.file }}" "{{ inputs.issue }}"

  - id: create-branch
    type: if
    condition: "{{ inputs.issue != '' }}"
    then:
      - id: branch
        type: shell
        run: bash .specify/presets/spec-kit-extended-flow/scripts/create-branch.sh "{{ inputs.issue }}"

  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    model: ""
    input:
      args: "{{ steps.resolve-spec.output.stdout }}"

  - id: verify-spec
    type: shell
    run: bash .specify/presets/spec-kit-extended-flow/scripts/verify-spec.sh

  - id: spec-gate
    type: gate
    message: "Review the generated specification. Approve to continue to planning, or reject to stop and edit the spec."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    model: ""
    input:
      args: "Infer the technical approach from the existing project. Reuse the current stack, architecture, test strategy, and quality constraints. Only introduce new dependencies, services, or infrastructure when required by the spec; document unresolved decisions as NEEDS CLARIFICATION."

  - id: plan-gate
    type: gate
    message: "Review the generated implementation plan. Approve to create tasks, or reject to stop and edit the plan."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    model: ""

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    model: ""

  - id: review
    command: speckit.extendedflow.review
    integration: "{{ inputs.integration }}"
    model: ""

  - id: review-verdict
    type: shell
    run: bash .specify/presets/spec-kit-extended-flow/scripts/extract-verdict.sh "{{ context.run_id }}"

  - id: fix-if-needed
    type: if
    condition: "{{ steps.review-verdict.output.stdout | contains('FAIL') }}"
    then:
      - id: fix-loop
        type: do-while
        condition: "{{ steps.fix-verdict.output.stdout | contains('FAIL') }}"
        max_iterations: 5
        steps:
          - id: fix
            command: speckit.extendedflow.fix
            integration: "{{ inputs.integration }}"
            model: ""
          - id: fix-review
            command: speckit.extendedflow.review
            integration: "{{ inputs.integration }}"
            model: ""
          - id: fix-verdict
            type: shell
            run: bash .specify/presets/spec-kit-extended-flow/scripts/extract-verdict.sh "{{ context.run_id }}"

  - id: stop-on-review-fail
    type: if
    condition: "{{ steps.fix-verdict.output.stdout | contains('FAIL') }}"
    then:
      - id: review-failed
        type: shell
        run: "echo 'QA review still failed after the maximum number of iterations. See review-findings-{N}-FAIL.md inside the current feature directory for details.' >&2; exit 1"

  - id: documentation
    command: speckit.extendedflow.documentation
    integration: "{{ inputs.integration }}"
    model: ""

  - id: finish
    command: speckit.extendedflow.finish
    integration: "{{ inputs.integration }}"
    model: ""
    input:
      args: "{{ context.run_id }} {{ inputs.issue }}"
