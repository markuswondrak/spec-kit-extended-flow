schema_version: "1.0"

extension:
  id: extendedflow
  name: "Spec-Kit Extended Flow"
  version: "0.13.0"
  description: "A complete agentic engineering pipeline that turns intent into working, reviewed, documented software. Extends Spec-Kit's SDD workflow with the standard implement/converge loop, living documentation reconciliation, issue-to-PR automation, and the standard Spec-Kit bug extension."
  author: "Markus Wondrak"
  repository: "https://github.com/markuswondrak/spec-kit-extended-flow"
  license: "MIT"

requires:
  speckit_version: ">=0.11.2"

provides:
  commands:
    - name: speckit.extendedflow.documentation
      file: commands/speckit.extendedflow.documentation.md
      description: "Documentation agent — maintains layered documentation as truth of intent, flags code-vs-docs conflicts"

    - name: speckit.extendedflow.documentation-init
      file: commands/speckit.extendedflow.documentation-init.md
      description: "Documentation init agent — bootstraps layered documentation structure for existing projects"

    - name: speckit.extendedflow.finish
      file: commands/speckit.extendedflow.finish.md
      description: "Finish agent — cleans up temporary run artifacts, commits changes, and opens a PR when started from an issue"

    - name: speckit.extendedflow.project-init
      file: commands/speckit.extendedflow.project-init.md
      description: "Project init agent — analyzes project and contextualizes Spec-Kit templates for its domain, tech stack, and architecture"

    - name: speckit.extendedflow.quick-implement
      file: commands/speckit.extendedflow.quick-implement.md
      description: "Quick implement agent — implements trivial changes directly from the instruction, no spec/plan/tasks"

    - name: speckit.extendedflow.quick-review
      file: commands/speckit.extendedflow.quick-review.md
      description: "Quick review agent — self-fixing review in a single pass, reviews and corrects in one step"

    - name: speckit.extendedflow.doc-check
      file: commands/speckit.extendedflow.doc-check.md
      description: "Doc check agent — lightweight documentation impact check, flags conflicts for human resolution"

tags:
  - "qa"
  - "review"
  - "documentation"
  - "workflow"
