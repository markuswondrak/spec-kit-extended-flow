schema_version: "1.0"

bundle:
  id: "spec-kit-extended-flow"
  name: "Spec-Kit Extended Flow"
  version: "0.10.1"
  role: "developer"
  description: "A complete agentic engineering pipeline: SDD workflow with QA review loop, living documentation reconciliation, bugfix TDD flow, and quick-change pipeline. Installs preset (templates + scripts), extension (13 commands), and 3 workflows (feature, bugfix, quick) in one operation."
  author: "Markus Wondrak"
  repository: "https://github.com/markuswondrak/spec-kit-extended-flow"
  license: "MIT"

requires:
  speckit_version: ">=0.9.0"
  tools: []
  mcp: []

# Agnostic bundle: inherits the project's active integration.

provides:
  extensions:
    - id: "extendedflow"
      version: "0.10.1"

  presets:
    - id: "spec-kit-extended-flow"
      version: "0.10.1"
      priority: 10
      strategy: "append"

  workflows:
    - id: "spec-kit-extended-flow"
      version: "0.9.0"
    - id: "spec-kit-bugfix-flow"
      version: "0.1.0"
    - id: "spec-kit-quick-flow"
      version: "0.1.0"

tags:
  - "qa"
  - "review"
  - "documentation"
  - "workflow"
  - "bugfix"
  - "tdd"
