schema_version: "1.0"

bundle:
  id: "spec-kit-extended-flow"
  name: "Spec-Kit Extended Flow"
  version: "0.13.0"
  role: "developer"
  description: "A complete agentic engineering pipeline: SDD workflow with the standard implement/converge loop, living documentation reconciliation, standard Spec-Kit bug flow, quick-change pipeline, and a Unified Flow with triage dispatch. Installs preset (templates + scripts), extension (8 commands), and 4 workflows (unified, feature, bugfix, quick) in one operation."
  author: "Markus Wondrak"
  repository: "https://github.com/markuswondrak/spec-kit-extended-flow"
  license: "MIT"

requires:
  speckit_version: ">=0.11.2"
  tools: []
  mcp: []

# Agnostic bundle: inherits the project's active integration.

provides:
  extensions:
    - id: "extendedflow"
      version: "0.13.0"
    - id: "bug"
      version: "1.0.0"

  presets:
    - id: "spec-kit-extended-flow"
      version: "0.13.0"
      priority: 10
      strategy: "append"

  workflows:
    - id: "spec-kit-unified-flow"
      version: "0.2.0"
    - id: "spec-kit-extended-flow"
      version: "0.10.0"
    - id: "spec-kit-bugfix-flow"
      version: "0.2.0"
    - id: "spec-kit-quick-flow"
      version: "0.1.0"

tags:
  - "qa"
  - "review"
  - "documentation"
  - "workflow"
  - "bugfix"
  - "tdd"
