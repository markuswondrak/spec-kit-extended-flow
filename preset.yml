schema_version: "1.0"

preset:
  id: "spec-kit-extended-flow"
  name: "Spec-Kit Extended Flow"
  version: "0.9.0"
  description: "A complete agentic engineering pipeline that turns intent into working, reviewed, documented software. Extends Spec-Kit's SDD workflow with a QA review loop, living documentation reconciliation, and issue-to-PR automation."
  author: "Markus Wondrak"
  repository: "https://github.com/markuswondrak/spec-kit-extended-flow"
  license: "MIT"

requires:
  speckit_version: ">=0.8.5"

provides:
  templates:
    - type: "template"
      name: "bug-analysis"
      file: "templates/bug-analysis.md"
      description: "Structured template for bug root-cause analysis, fix strategy, and test plan"

    - type: "template"
      name: "review-findings"
      file: "templates/review-findings.md"
      description: "Structured template for the Reviewer to log bugs, edge-case failures, or spec deviations"

    - type: "template"
      name: "documentation"
      file: "templates/documentation.md"
      description: "Structured report template for documentation reconciliation (conflicts, layer health, changes by category)"

  tags:
  - "qa"
  - "review"
  - "documentation"
  - "workflow"
