name: Release preset package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build preset package
        run: scripts/package-preset.sh

      - name: Verify preset package
        run: |
          unzip -t dist/spec-kit-extended-flow.zip
          unzip -Z1 dist/spec-kit-extended-flow.zip

      - name: Verify extension manifest
        run: |
          unzip -p dist/spec-kit-extended-flow.zip extension.yml > /dev/null
          echo "extension.yml found in package"

      - name: Verify bundle manifest
        run: |
          unzip -p dist/spec-kit-extended-flow.zip bundle.yml > /dev/null
          echo "bundle.yml found in package"

      - name: Build catalog artifacts
        run: |
          scripts/build-catalog.sh
          for artifact in catalog/artifacts/*.zip; do
            unzip -t "$artifact"
          done

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          assets=("dist/spec-kit-extended-flow.zip")
          for artifact in catalog/artifacts/*.zip; do
            assets+=("$artifact")
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$tag" \
              --notes "Spec-Kit Extended Flow preset package and catalog artifacts."
          fi
