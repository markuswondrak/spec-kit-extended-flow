name: Release preset package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build preset package
        run: python3 scripts/package-preset.py

      - name: Verify preset package
        run: python3 -c "import zipfile; archive=zipfile.ZipFile('dist/spec-kit-extended-flow.zip'); assert archive.testzip() is None; assert 'extension.yml' in archive.namelist(); assert 'bundle.yml' in archive.namelist()"

      - name: Build catalog artifacts
        run: python3 scripts/build-catalog.py

      - name: Verify catalog artifacts
        run: python3 -c "import pathlib, zipfile; artifacts=list(pathlib.Path('catalog/artifacts').glob('*.zip')); assert artifacts; assert all(zipfile.ZipFile(artifact).testzip() is None for artifact in artifacts)"

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          assets=("dist/spec-kit-extended-flow.zip")
          for artifact in catalog/artifacts/*.zip; do
            assets+=("$artifact")
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$tag" \
              --notes "Spec-Kit Extended Flow preset package and catalog artifacts."
          fi
